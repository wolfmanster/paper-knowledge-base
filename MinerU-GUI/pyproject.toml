[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-gui"
dynamic = ["version"]
description = "MinerU document parsing tool — desktop GUI + Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mineru", "pdf", "ocr", "document-parser"]

authors = [
    { name = "wolfmanster" },
]

dependencies = [
    "customtkinter>=5.2.2",
    "windnd>=1.0.7",
    "loguru",
    "Pillow",
]

[project.optional-dependencies]
# ⚠️ MinerU PDF 提取引擎 — 必须使用 3.x 版本（4.x 尚未发布）
# 安装：pip install "mineru-gui[mineru]"
mineru = ["mineru[core]>=3.0.0,<4.0.0"]
dev = ["pytest", "black", "ruff"]

## 发版时通过 git tag 设置版本号
[tool.setuptools_scm]
root = ".."
fallback_version = "0.0.0.dev0"

# app.py / mineru_api.py 是顶层单文件模块；gui/ 是包
[tool.setuptools]
py-modules = ["app", "mineru_api"]

[tool.setuptools.packages.find]
include = ["gui*"]
