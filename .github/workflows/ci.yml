name: CI

on:
  push:
  pull_request:

jobs:
  paper-knowledge-base-tests:
    name: Paper knowledge base tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-knowledge-base

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v -s

  mineru-gui-lint:
    name: MinerU GUI lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MinerU-GUI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check .
